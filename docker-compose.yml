services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: louis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: louis
      POSTGRES_PASSWORD: louis
      POSTGRES_DB: louis
    ports:
      # Host port 5433 to avoid conflict with other local Postgres instances.
      # Inside the container Postgres still listens on 5432.
      - "5433:5432"
    volumes:
      - louis-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U louis -d louis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: louis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - louis-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO no longer publishes community images (minio/minio, quay.io/minio/minio):
  # SeaweedFS serves the same S3 API on :9000. No S3 auth configured: local dev only.
  minio:
    image: chrislusf/seaweedfs:latest
    container_name: louis-minio
    restart: unless-stopped
    command: "server -dir=/data -s3 -s3.port=9000 -ip.bind=0.0.0.0"
    ports:
      - "9000:9000"
    volumes:
      - louis-minio:/data

  # Gotenberg : LibreOffice headless exposé via HTTP, utilisé pour le rendu
  # fidèle DOCX → PDF du DocPanel. ~300 MB d'image. Activé côté app via
  # GOTENBERG_URL=http://localhost:3001 dans .env.
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: louis-gotenberg
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--api-port=3000"
      - "--api-timeout=60s"
    ports:
      - "3001:3000"

volumes:
  louis-postgres:
  louis-redis:
  louis-minio:
